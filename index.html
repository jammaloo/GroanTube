<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Groan Tube</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    margin: 0; overflow: hidden; touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    background: radial-gradient(120% 90% at 50% 0%, #45307a 0%, #241a4d 45%, #120d29 100%);
    color: #fff;
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  #stage {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px);
  }

  header {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .chip {
    font-size: 13px; font-weight: 700; letter-spacing: .4px;
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16);
    padding: 7px 12px; border-radius: 999px; backdrop-filter: blur(6px);
    white-space: nowrap;
  }
  button.chip { color: #fff; cursor: pointer; font-family: inherit; }
  h1 {
    margin: 0; font-size: 17px; letter-spacing: 3px; font-weight: 900;
    color: #ffd166; text-shadow: 0 2px 10px rgba(255,209,102,.35);
    text-align: center; flex: 1;
  }

  #tubeArea { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }
  #tubeWrap { cursor: pointer; padding: 20px 30px; }
  #tubeWrap.shaking { animation: shake .45s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: translate(0,0) rotate(0); }
    15% { transform: translate(-9px, 4px) rotate(-4deg); }
    30% { transform: translate(8px, -5px) rotate(3.5deg); }
    45% { transform: translate(-8px, -3px) rotate(-3deg); }
    60% { transform: translate(7px, 4px) rotate(2.5deg); }
    75% { transform: translate(-5px, 2px) rotate(-2deg); }
    90% { transform: translate(4px, -2px) rotate(1.2deg); }
  }

  #tube {
    position: relative;
    width: clamp(96px, 26vw, 140px);
    height: min(50vh, 400px);
    display: flex; flex-direction: column; align-items: center;
    transform: rotate(0deg);
    transition: transform .65s cubic-bezier(.34, 1.45, .55, 1);
    filter: drop-shadow(0 26px 34px rgba(0,0,0,.5));
  }
  #tube .cap {
    width: 116%; height: 34px; border-radius: 17px; z-index: 2;
    background: linear-gradient(180deg, #ff7b6b, #c1121f 55%, #8d0b14);
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.35), inset 0 3px 5px rgba(255,255,255,.25);
  }
  #tube .body {
    flex: 1; width: 100%; margin: -6px 0; border-radius: 26px; position: relative; overflow: hidden;
    background:
      radial-gradient(60% 40% at 30% 12%, rgba(255,255,255,.28), transparent 60%),
      linear-gradient(100deg, #ff6b6b 0%, #e63946 45%, #b51d27 100%);
    box-shadow: inset 0 10px 18px rgba(255,255,255,.15), inset 0 -14px 22px rgba(0,0,0,.35);
  }
  #tube .shine {
    position: absolute; top: 6%; bottom: 6%; left: 12%; width: 14%; border-radius: 10px;
    background: linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,.06));
    filter: blur(2px);
  }

  .face {
    position: absolute; top: 15%; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .eyes { display: flex; gap: 22px; }
  .eye {
    width: 24px; height: 28px; background: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .12s;
  }
  .pupil { width: 11px; height: 13px; background: #2b1a1a; border-radius: 50%; margin-top: 4px; }
  .mouth {
    position: absolute; top: 44px; left: 50%;
    width: 34px; height: 52px;
    border-radius: 20px 20px 24px 24px; background: #4a080d;
    box-shadow: inset 0 3px 4px rgba(0,0,0,.5);
    transform: translateX(-50%) scaleY(.15); transform-origin: 50% 100%;
  }
  .face.groan .eye { transform: scaleY(.55); }

  #hint, #status { font-size: 13px; opacity: .7; margin: 10px 0 0; text-align: center; line-height: 1.45; }
  #status { margin-top: 8px; font-size: 12px; opacity: .55; font-variant-numeric: tabular-nums; }

  #controls { display: flex; gap: 14px; width: 100%; max-width: 420px; margin-top: 12px; }
  #controls button {
    flex: 1; padding: 16px 10px; font-size: 17px; font-weight: 800; letter-spacing: .5px;
    color: #fff; border-radius: 18px; border: 1px solid rgba(255,255,255,.22);
    cursor: pointer; font-family: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    box-shadow: 0 6px 18px rgba(0,0,0,.35); transition: transform .08s;
  }
  #controls button:active { transform: scale(.94); }

  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    background: rgba(13,9,29,.72); backdrop-filter: blur(10px);
    transition: opacity .45s, visibility .45s;
  }
  #overlay.hide { opacity: 0; visibility: hidden; }
  #startBtn {
    width: 190px; height: 190px; border-radius: 50%; border: none; cursor: pointer;
    color: #fff; font-family: inherit; font-size: 18px; font-weight: 800; letter-spacing: 1px;
    background: radial-gradient(120% 120% at 30% 25%, #ff7b6b, #d62828 60%, #9d0208);
    box-shadow: 0 18px 50px rgba(214,40,40,.45), inset 0 4px 10px rgba(255,255,255,.3);
    animation: pulse 1.8s ease-in-out infinite;
    display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center;
  }
  #startBtn span { font-size: 44px; line-height: 1; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  #overlay p { opacity: .75; font-size: 14px; text-align: center; max-width: 280px; line-height: 1.5; margin: 0; padding: 0 16px; }
</style>
</head>
<body>
  <div id="stage">
    <header>
      <div class="chip" id="count">GROANS × 0</div>
      <h1>GROAN TUBE</h1>
      <button class="chip" id="mute" title="Mute">🔊</button>
    </header>

    <div id="tubeArea">
      <div id="tubeWrap" title="Click to flip">
        <div id="tube">
          <div class="cap top"></div>
          <div class="body">
            <div class="shine"></div>
            <div class="face" id="face">
              <div class="eyes">
                <div class="eye"><div class="pupil"></div></div>
                <div class="eye"><div class="pupil"></div></div>
              </div>
              <div class="mouth" id="mouth"></div>
            </div>
          </div>
          <div class="cap bottom"></div>
        </div>
      </div>
    </div>

    <p id="hint">Tip your phone past horizontal and the disk starts to fall &mdash; flip it all the way for the big groan!</p>
    <div id="controls">
      <button id="flipBtn">🔄 FLIP</button>
      <button id="shakeBtn">📳 SHAKE</button>
    </div>
    <p id="status"></p>
  </div>

  <div id="overlay">
    <button id="startBtn"><span>▶</span>TAP TO PLAY</button>
    <p>Turn your sound on. This toy uses motion sensors &mdash; a weighted disk falls inside the tube and groans as it goes. Buttons work everywhere.</p>
  </div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const tube = $('#tube'), tubeWrap = $('#tubeWrap'), face = $('#face'),
      mouth = $('#mouth'), hint = $('#hint'), statusEl = $('#status'),
      countEl = $('#count'), muteBtn = $('#mute'), overlay = $('#overlay'),
      startBtn = $('#startBtn');

const status = t => { statusEl.textContent = t; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ============ tuning ============ */
// Disk physics (tube length = 1.0, v in tube-lengths/second)
const PHYS = {
  A: 0.6,        // gravity coupling along the tube axis (per g)
  DRAG: 1.25,    // viscous drag (air + wall) -> decay time ~0.8s
  FRICT: 0.3,    // Coulomb friction: disk stalls near horizontal
  STOPV: 0.02,   // below this speed the disk just stops
  MAXV: 1.4,
  BOUNCE: 0.18,  // speed kept when the disk lands on a cap
};
// Reed sound (classic tubes sit higher and wail longer than speech)
const SND = { FMIN: 140, KF: 260, FMAX: 520, GMAX: 0.55, TC: 0.045, LFO_HZ: 7.5 };

/* ============ audio: one persistent reed voice, driven by the disk ============ */
let ctx = null, master = null, noiseBuf = null, distCurve = null;
let osc1, osc2, lfoG, voice, airG, muted = false;

function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 20; comp.ratio.value = 5;
  master.connect(comp); comp.connect(ctx.destination);

  distCurve = makeDistCurve(14);
  noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  // reed buzz
  osc1 = ctx.createOscillator(); osc1.type = 'sawtooth';
  osc2 = ctx.createOscillator(); osc2.type = 'square'; osc2.detune.value = 8;
  const o2g = ctx.createGain(); o2g.gain.value = 0.3;
  osc1.frequency.value = SND.FMIN; osc2.frequency.value = SND.FMIN;

  // wobble: pitch vibrato + tremolo, the classic "groan" warble
  const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = SND.LFO_HZ;
  lfoG = ctx.createGain(); lfoG.gain.value = 0;
  lfo.connect(lfoG); lfoG.connect(osc1.frequency); lfoG.connect(osc2.frequency);

  const pre = ctx.createGain(); pre.gain.value = 0.8;
  const ws = ctx.createWaveShaper(); ws.curve = distCurve; ws.oversample = '2x';
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = 0.7;
  const pk = ctx.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 950; pk.Q.value = 1.1; pk.gain.value = 9;
  voice = ctx.createGain(); voice.gain.value = 0;

  osc1.connect(pre); osc2.connect(o2g); o2g.connect(pre);
  pre.connect(ws); ws.connect(hp); hp.connect(lp); lp.connect(pk); pk.connect(voice); voice.connect(master);

  // rushing air through the valve
  const air = ctx.createBufferSource(); air.buffer = noiseBuf; air.loop = true;
  const airBp = ctx.createBiquadFilter(); airBp.type = 'bandpass'; airBp.frequency.value = 1500; airBp.Q.value = 0.5;
  airG = ctx.createGain(); airG.gain.value = 0;
  air.connect(airBp); airBp.connect(airG); airG.connect(master);

  osc1.start(); osc2.start(); lfo.start(); air.start();
}

function makeDistCurve(k) {
  const n = 1024, c = new Float32Array(n), deg = Math.PI / 180;
  for (let i = 0; i < n; i++) {
    const x = i * 2 / n - 1;
    c[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
  }
  return c;
}

// map disk speed -> reed pitch, loudness, wobble, air
function updateSound() {
  if (!ctx) return;
  const v = Math.abs(disk.v);
  const f = clamp(SND.FMIN + SND.KF * v, 150, SND.FMAX);
  const g = Math.pow(Math.min(1, v / 0.9), 1.15) * SND.GMAX;
  const t = ctx.currentTime;
  osc1.frequency.setTargetAtTime(f, t, SND.TC);
  osc2.frequency.setTargetAtTime(f, t, SND.TC);
  lfoG.gain.setTargetAtTime(f * 0.075, t, 0.1);
  voice.gain.setTargetAtTime(g, t, 0.06);
  airG.gain.setTargetAtTime(0.05 * Math.min(1, v / 0.7), t, 0.08);

  mouth.style.transform = `translateX(-50%) scaleY(${(0.12 + (g / SND.GMAX) * 0.88).toFixed(3)})`;
  face.classList.toggle('groan', g > 0.05);
}

function thud(impact) {
  if (!ctx) return;
  const t = ctx.currentTime;
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 500 + Math.random() * 250; bp.Q.value = 1;
  const g = ctx.createGain();
  g.gain.setValueAtTime(Math.min(0.4, impact * 0.45), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(t); s.stop(t + 0.1);
}

/* ============ the hidden disk ============ */
const disk = { p: 0, v: 0 };   // p: 0 = one cap, 1 = the other; invisible on purpose
let motionLive = false, virtualGs = 1;   // "gravity" used when there is no sensor

function stepDisk(dt) {
  const c = motionLive ? clamp(sm.y / 9.81, -1, 1) : virtualGs;
  const drive = -c * PHYS.A;             // gravity component along the tube axis

  let v = disk.v + drive * dt - PHYS.DRAG * disk.v * dt;
  const fr = PHYS.FRICT * dt;
  if (Math.abs(v) <= fr) v = 0; else v -= Math.sign(v) * fr;
  if (Math.abs(v) < PHYS.STOPV && Math.abs(drive) < PHYS.FRICT) v = 0;
  disk.v = clamp(v, -PHYS.MAXV, PHYS.MAXV);
  disk.p += disk.v * dt;

  if (disk.p > 1) {
    disk.p = 1;
    if (disk.v > 0.12) { thud(disk.v); disk.v = -disk.v * PHYS.BOUNCE; }
    else disk.v = 0;
  } else if (disk.p < 0) {
    disk.p = 0;
    if (disk.v < -0.12) { thud(-disk.v); disk.v = -disk.v * PHYS.BOUNCE; }
    else disk.v = 0;
  }
}

/* ============ main loop ============ */
let lastT = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  stepDisk(dt);
  updateSound();
  setTimeout(loop, 16);
}
loop();

/* ============ motion ============ */
let sm = { x: 0, y: 0, z: -9.81 };
let cPrev = null, cPrevT = 0, omegaS = 0, flipDir = 0, lastShake = 0;

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  motionLive = true;

  const k = 0.35;
  sm.x += k * (a.x - sm.x); sm.y += k * (a.y - sm.y); sm.z += k * (a.z - sm.z);
  const now = performance.now();

  // shaking rattles the disk with random impulses
  let lin = e.acceleration;
  if (!lin || lin.x == null) lin = { x: a.x - sm.x, y: a.y - sm.y, z: a.z - sm.z };
  const mag = Math.hypot(lin.x, lin.y, lin.z);
  if (mag > 6.5 && now - lastShake > 130) {
    lastShake = now;
    rattle(Math.min(1, (mag - 6.5) / 12));
  }

  // gravity along the phone's long axis, in g
  const c = clamp(sm.y / 9.81, -1, 1);
  if (cPrev !== null && now > cPrevT) {
    const th = Math.acos(clamp(c, -1, 1)), thp = Math.acos(clamp(cPrev, -1, 1));
    const omega = Math.abs(th - thp) / ((now - cPrevT) / 1000);
    omegaS += 0.3 * (omega - omegaS);
  }
  cPrev = c; cPrevT = now;

  // a flip = the phone's ends actually swap (tips past horizontal with margin)
  const dir = c > 0.2 ? 1 : c < -0.2 ? -1 : flipDir;
  if (flipDir !== 0 && dir !== flipDir) onFlipEvent(dir);
  if (flipDir === 0) flipDir = dir;
}

function onFlipEvent(dir) {
  // the flip yanks the disk; harder flips kick it faster -> louder, higher, longer
  const kick = (0.55 + clamp(omegaS / 7, 0, 1) * 0.5) * -dir;
  disk.v = clamp(disk.v + kick, -PHYS.MAXV, PHYS.MAXV);
  rot += 180;
  tube.style.transform = `rotate(${rot}deg)`;
  countEl.textContent = `GROANS × ${++groans}`;
}

function rattle(intensity) {
  disk.v = clamp(disk.v + (Math.random() * 1.4 - 0.7) * (0.6 + intensity * 0.8), -PHYS.MAXV, PHYS.MAXV);
  pulseShake();
}

/* ============ UI ============ */
let rot = 0, groans = 0, shakeTimer = 0;

function pulseShake() {
  tubeWrap.classList.remove('shaking');
  void tubeWrap.offsetWidth;
  tubeWrap.classList.add('shaking');
  clearTimeout(shakeTimer);
  shakeTimer = setTimeout(() => tubeWrap.classList.remove('shaking'), 460);
}

function buttonFlip() {
  if (motionLive) {
    // real sensors: shove the disk toward whichever cap is farther, it groans on the fly
    const dirTo = disk.p > 0.5 ? -1 : 1;
    disk.v = clamp(disk.v + dirTo * 0.9, -PHYS.MAXV, PHYS.MAXV);
  } else {
    // no sensor: flip the virtual gravity so the disk falls the whole tube
    virtualGs = -virtualGs;
    disk.v = clamp(disk.v - Math.sign(virtualGs) * 0.85, -PHYS.MAXV, PHYS.MAXV);
  }
  rot += 180;
  tube.style.transform = `rotate(${rot}deg)`;
  countEl.textContent = `GROANS × ${++groans}`;
}

function buttonShake() {
  pulseShake();
  const dirTo = disk.p > 0.5 ? -1 : 1;
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      disk.v = clamp(disk.v + dirTo * (0.45 + Math.random() * 0.55), -PHYS.MAXV, PHYS.MAXV);
    }, i * (80 + Math.random() * 80));
  }
}

flipBtn.addEventListener('click', buttonFlip);
shakeBtn.addEventListener('click', buttonShake);
tubeWrap.addEventListener('click', buttonFlip);

addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'f' || k === ' ') { e.preventDefault(); buttonFlip(); }
  if (k === 's') buttonShake();
});

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (master) master.gain.value = muted ? 0 : 0.9;
});

document.addEventListener('visibilitychange', () => {
  if (!ctx) return;
  if (document.hidden) ctx.suspend(); else ctx.resume();
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

let motionAttached = false;
function attachMotion() {
  if (motionAttached) return;
  window.addEventListener('devicemotion', onMotion);
  motionAttached = true;
  setTimeout(() => {
    if (!motionLive) status('No motion events — this page needs HTTPS on a phone. Buttons still work!');
  }, 1500);
}

startBtn.addEventListener('click', async () => {
  initAudio();
  ctx.resume();
  overlay.classList.add('hide');
  hint.textContent = ('ontouchstart' in window || navigator.maxTouchPoints > 0)
    ? 'Tip your phone past horizontal and the disk starts to fall — flip it all the way for the big groan!'
    : 'Click the tube, press F to flip, S to shake.';

  const DME = window.DeviceMotionEvent;
  try {
    if (DME && typeof DME.requestPermission === 'function') {
      const r = await DME.requestPermission();
      if (r === 'granted') { attachMotion(); status('Motion live — tip the tube past horizontal!'); }
      else status('Motion blocked — use the buttons below.');
    } else if (DME) {
      attachMotion();
      status('Waiting for sensor…');
    } else {
      status('No motion sensor here — use the buttons (or F / S keys).');
    }
  } catch (err) {
    status('Motion unavailable — buttons still work.');
  }
});
})();
</script>
</body>
</html>
