<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff9de4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Groan Tube</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    margin: 0; overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none;
    background: #ff9de4;
    color: #5c1a87;
    font-family: "Shrikhand", ui-rounded, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  #stage {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px);
  }

  header {
    width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  }
  #mute { grid-column: 3; justify-self: end; }
  .chip {
    font-size: 13px; font-weight: 700; letter-spacing: .5px;
    background: rgba(255,255,255,.35); border: 1px solid rgba(92,26,135,.22);
    color: #5c1a87;
    padding: 7px 12px; border-radius: 999px; backdrop-filter: blur(6px);
    white-space: nowrap;
  }
  button.chip { color: #5c1a87; cursor: pointer; font-family: inherit; }
  h1 {
    margin: 0; font-size: 18px; letter-spacing: 1px; font-weight: 400;
    color: #5c1a87; text-shadow: 0 2px 0 rgba(255,255,255,.4);
    text-align: center; grid-column: 2;
  }

  #tubeArea { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }
  #tubeWrap { cursor: grab; touch-action: none; padding: 20px 30px; }
  #tubeWrap.dragging { cursor: grabbing; }
  #tubeWrap.shaking { animation: shake .45s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: translate(0,0) rotate(0); }
    15% { transform: translate(-9px, 4px) rotate(-4deg); }
    30% { transform: translate(8px, -5px) rotate(3.5deg); }
    45% { transform: translate(-8px, -3px) rotate(-3deg); }
    60% { transform: translate(7px, 4px) rotate(2.5deg); }
    75% { transform: translate(-5px, 2px) rotate(-2deg); }
    90% { transform: translate(4px, -2px) rotate(1.2deg); }
  }

  #tube {
    position: relative;
    width: clamp(96px, 26vw, 140px);
    height: min(50vh, 400px);
    display: flex; flex-direction: column; align-items: center;
    transform: rotate(0rad);
    filter: drop-shadow(0 26px 34px rgba(90, 20, 120, .35));
  }
  #tube .cap {
    width: 116%; height: 34px; border-radius: 17px; z-index: 2;
    background: linear-gradient(180deg, #c084fc, #7e22ce 55%, #581c87);
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.3), inset 0 3px 5px rgba(255,255,255,.3);
  }
  #tube .body {
    flex: 1; width: 100%; margin: -6px 0; border-radius: 26px; position: relative; overflow: hidden;
    background:
      radial-gradient(60% 40% at 30% 12%, rgba(255,255,255,.3), transparent 60%),
      linear-gradient(100deg, #b565f0 0%, #9333ea 45%, #6b21a8 100%);
    box-shadow: inset 0 10px 18px rgba(255,255,255,.18), inset 0 -14px 22px rgba(40,7,66,.4);
  }
  #tube .shine {
    position: absolute; top: 6%; bottom: 6%; left: 12%; width: 14%; border-radius: 10px;
    background: linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,.06));
    filter: blur(2px);
  }

  .face {
    position: absolute; top: 15%; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .eyes { display: flex; gap: 22px; }
  .eye {
    width: 24px; height: 28px; background: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .12s;
  }
  .pupil { width: 11px; height: 13px; background: #3a1d55; border-radius: 50%; will-change: transform; }
  .mouth {
    position: absolute; top: 44px; left: 50%;
    width: 34px; height: 52px;
    border-radius: 20px 20px 24px 24px; background: #3b0764;
    box-shadow: inset 0 3px 4px rgba(0,0,0,.45);
    transform: translateX(-50%) scaleY(.05); transform-origin: 50% 100%;
  }
  .face.groan .eye { transform: scaleY(.55); }

  #hint { font-size: 18px; margin: 10px 0 0; text-align: center; line-height: 1.45; }

  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    background: rgba(58, 15, 94, .5); backdrop-filter: blur(10px);
    transition: opacity .45s, visibility .45s;
  }
  #overlay.hide { opacity: 0; visibility: hidden; }
  #startBtn {
    width: 190px; height: 190px; border-radius: 50%; border: none; cursor: pointer;
    color: #fff; font-family: inherit; font-size: 18px; font-weight: 400; letter-spacing: 1px;
    background: radial-gradient(120% 120% at 30% 25%, #c084fc, #9333ea 60%, #6b21a8);
    box-shadow: 0 18px 50px rgba(147,51,234,.4), inset 0 4px 10px rgba(255,255,255,.35);
    animation: pulse 1.8s ease-in-out infinite;
    display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center;
  }
  #startBtn span { font-size: 44px; line-height: 1; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  #overlay p { color: #fff; opacity: .85; font-size: 14px; text-align: center; max-width: 280px; line-height: 1.5; margin: 0; padding: 0 16px; }
</style>
</head>
<body>
  <div id="stage">
    <header>
      <h1>GROAN TUBE</h1>
      <button class="chip" id="mute" title="Mute">🔊</button>
    </header>

    <div id="tubeArea">
      <div id="tubeWrap">
        <div id="tube">
          <div class="cap top"></div>
          <div class="body">
            <div class="shine"></div>
            <div class="face" id="face">
              <div class="eyes">
                <div class="eye"><div class="pupil"></div></div>
                <div class="eye"><div class="pupil"></div></div>
              </div>
              <div class="mouth" id="mouth"></div>
            </div>
          </div>
          <div class="cap bottom"></div>
        </div>
      </div>
    </div>

    <p id="hint">Spin me!</p>
  </div>

  <div id="overlay">
    <button id="startBtn"><span>▶</span>TAP TO PLAY</button>
    <p>Sound on! Spin your phone and hear that tune go waahahaa</p>
  </div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const tube = $('#tube'), tubeWrap = $('#tubeWrap'), face = $('#face'),
      mouth = $('#mouth'), hint = $('#hint'),
      muteBtn = $('#mute'), overlay = $('#overlay'),
      startBtn = $('#startBtn');

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ============ tuning ============ */
// Disk physics (tube length = 1.0, v in tube-lengths/second)
const PHYS = {
  A: 0.6,        // gravity coupling along the tube axis (per g)
  DRAG: 1.25,    // viscous drag (air + wall) -> decay time ~0.8s
  FRICT: 0.3,    // Coulomb friction: disk stalls when the tube is near level
  STOPV: 0.02,
  MAXV: 1.4,
  BOUNCE: 0.18,  // speed kept when the disk lands on a cap
};
// Reed sound (classic tubes sit higher and wail longer than speech).
// The valve is directional: falling toward the face end is brighter, toward the plain cap deeper.
const SND = { FMIN: 140, KF: 260, FMAX: 520, GMAX: 0.55, TC: 0.045, LFO_HZ: 7.5, UP: 100, DOWN: 25 };
// Spin feel
const SPIN = { DAMP: 2.2, MAXSTEP: 0.3, NEAR: 24 };

/* ============ audio: one persistent reed voice, driven by the disk ============ */
let ctx = null, master = null, noiseBuf = null, distCurve = null;
let osc1, osc2, lfoG, voice, airG, muted = false;

function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 20; comp.ratio.value = 5;
  master.connect(comp); comp.connect(ctx.destination);

  distCurve = makeDistCurve(14);
  noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  // reed buzz
  osc1 = ctx.createOscillator(); osc1.type = 'sawtooth';
  osc2 = ctx.createOscillator(); osc2.type = 'square'; osc2.detune.value = 8;
  const o2g = ctx.createGain(); o2g.gain.value = 0.3;
  osc1.frequency.value = SND.FMIN; osc2.frequency.value = SND.FMIN;

  // wobble: pitch vibrato + tremolo, the classic "groan" warble
  const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = SND.LFO_HZ;
  lfoG = ctx.createGain(); lfoG.gain.value = 0;
  lfo.connect(lfoG); lfoG.connect(osc1.frequency); lfoG.connect(osc2.frequency);

  const pre = ctx.createGain(); pre.gain.value = 0.8;
  const ws = ctx.createWaveShaper(); ws.curve = distCurve; ws.oversample = '2x';
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = 0.7;
  const pk = ctx.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 950; pk.Q.value = 1.1; pk.gain.value = 9;
  voice = ctx.createGain(); voice.gain.value = 0;

  osc1.connect(pre); osc2.connect(o2g); o2g.connect(pre);
  pre.connect(ws); ws.connect(hp); hp.connect(lp); lp.connect(pk); pk.connect(voice); voice.connect(master);

  // rushing air through the valve
  const air = ctx.createBufferSource(); air.buffer = noiseBuf; air.loop = true;
  const airBp = ctx.createBiquadFilter(); airBp.type = 'bandpass'; airBp.frequency.value = 1500; airBp.Q.value = 0.5;
  airG = ctx.createGain(); airG.gain.value = 0;
  air.connect(airBp); airBp.connect(airG); airG.connect(master);

  osc1.start(); osc2.start(); lfo.start(); air.start();
}

function makeDistCurve(k) {
  const n = 1024, c = new Float32Array(n), deg = Math.PI / 180;
  for (let i = 0; i < n; i++) {
    const x = i * 2 / n - 1;
    c[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
  }
  return c;
}

// map disk speed -> reed pitch, loudness, wobble, air
function updateSound() {
  if (!ctx) return;
  const v = Math.abs(disk.v);
  // falling toward the face end (v < 0) gets the brighter register
  const dirShift = disk.v < 0 ? SND.UP : -SND.DOWN;
  const f = clamp(SND.FMIN + dirShift + SND.KF * v, 150, SND.FMAX);
  const g = Math.pow(Math.min(1, v / 0.9), 1.15) * SND.GMAX;
  const t = ctx.currentTime;
  osc1.frequency.setTargetAtTime(f, t, SND.TC);
  osc2.frequency.setTargetAtTime(f, t, SND.TC);
  lfoG.gain.setTargetAtTime(f * 0.075, t, 0.1);
  voice.gain.setTargetAtTime(g, t, 0.06);
  airG.gain.setTargetAtTime(0.05 * Math.min(1, v / 0.7), t, 0.08);
  window.__gt = { f, v: disk.v, p: disk.p };

  // the face follows the disk: fully closed at the bottom cap, wide open at the face end
  mouth.style.transform = `translateX(-50%) scaleY(${(0.05 + (1 - disk.p) * 0.95).toFixed(3)})`;
  face.classList.toggle('groan', disk.p < 0.5);
}

function thud(impact) {
  if (!ctx) return;
  const t = ctx.currentTime;
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 500 + Math.random() * 250; bp.Q.value = 1;
  const g = ctx.createGain();
  g.gain.setValueAtTime(Math.min(0.4, impact * 0.45), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(t); s.stop(t + 0.1);
}

/* ============ the hidden disk ============ */
const disk = { p: 1, v: 0 };        // starts resting on the bottom cap; invisible on purpose
let theta = 0, thetaV = 0;          // tube angle (rad) and spin momentum, user-controlled
let dragging = false;
let motionLive = false, gSign = 0;  // gSign calibrated from the first second of sensor data
let calibN = 0, calibSum = 0;

// screen-space gravity unit vector: straight down, or fed by the phone's sensors
function screenGravity() {
  if (motionLive && gSign !== 0) {
    const m = Math.hypot(sm.x, sm.y);
    if (m > 1.5) return { x: -gSign * sm.x / 9.81, y: gSign * sm.y / 9.81 };
  }
  return { x: 0, y: 1 };
}

let cPrev = null, dcSm = 0, lastDir = 0;

function stepDisk(dt) {
  const g = screenGravity();
  const c = g.x * Math.sin(theta) - g.y * Math.cos(theta); // gravity along the tube's top axis
  const drive = -c * PHYS.A;

  // swinging the tube past level yanks the disk — faster swings kick it harder
  const dir = c > 0.25 ? 1 : c < -0.25 ? -1 : lastDir;
  if (lastDir !== 0 && dir !== lastDir) {
    const kick = clamp(0.35 + Math.abs(dcSm) * 0.12, 0.35, 1.0) * -dir;
    disk.v = clamp(disk.v + kick, -PHYS.MAXV, PHYS.MAXV);
  }
  lastDir = dir;
  const dc = cPrev === null ? 0 : (c - cPrev) / Math.max(dt, 0.001);
  dcSm += 0.3 * (dc - dcSm);
  cPrev = c;

  let v = disk.v + drive * dt - PHYS.DRAG * disk.v * dt;
  const fr = PHYS.FRICT * dt;
  if (Math.abs(v) <= fr) v = 0; else v -= Math.sign(v) * fr;
  if (Math.abs(v) < PHYS.STOPV && Math.abs(drive) < PHYS.FRICT) v = 0;
  disk.v = clamp(v, -PHYS.MAXV, PHYS.MAXV);
  disk.p += disk.v * dt;

  if (disk.p > 1) {
    disk.p = 1;
    if (disk.v > 0.12) { thud(disk.v); disk.v = -disk.v * PHYS.BOUNCE; }
    else disk.v = 0;
  } else if (disk.p < 0) {
    disk.p = 0;
    if (disk.v < -0.12) { thud(-disk.v); disk.v = -disk.v * PHYS.BOUNCE; }
    else disk.v = 0;
  }
}

/* ============ googly eyes ============ */
const pupils = [...document.querySelectorAll('.pupil')].map((el, i) => ({
  el, x: 0, y: 0, vx: 0, vy: 0, k: i === 0 ? 0.85 : 1.15, // k desyncs the pair
}));
let eyeOffsets = null, eyePrevPos = null, eyePrevVel = { x: 0, y: 0 }, eyeAcc = { x: 0, y: 0 };

function measureEyes() {
  const t = tube.getBoundingClientRect();
  const cos = Math.cos(theta), sin = Math.sin(theta);
  eyeOffsets = pupils.map(({ el }) => {
    const e = el.parentElement.getBoundingClientRect();
    const sx = (e.left + e.width / 2) - (t.left + t.width / 2);
    const sy = (e.top + e.height / 2) - (t.top + t.height / 2);
    return { x: sx * cos + sy * sin, y: -sx * sin + sy * cos }; // undo current rotation
  });
  eyePrevPos = null;
}
measureEyes();
addEventListener('resize', measureEyes);
setTimeout(measureEyes, 900); // re-measure once the webfont has settled the layout

function updateEyes(dt) {
  if (!eyeOffsets || dt <= 0) return;
  const t = tube.getBoundingClientRect();
  const g = screenGravity();
  const cos = Math.cos(theta), sin = Math.sin(theta);

  // gravity in the tube's own frame: pupils roll to the low end, whatever the orientation
  const gl = { x: g.x * cos + g.y * sin, y: -g.x * sin + g.y * cos };

  // inertial pseudo-force: how the eye is being thrown around on screen
  const ec = { x: t.left + t.width / 2 + eyeOffsets[0].x * cos - eyeOffsets[0].y * sin,
               y: t.top + t.height / 2 + eyeOffsets[0].x * sin + eyeOffsets[0].y * cos };
  if (eyePrevPos) {
    const nvx = (ec.x - eyePrevPos.x) / dt, nvy = (ec.y - eyePrevPos.y) / dt;
    const acc = { x: clamp((nvx - eyePrevVel.x) / dt, -4000, 4000),
                  y: clamp((nvy - eyePrevVel.y) / dt, -4000, 4000) };
    eyeAcc.x += 0.4 * (acc.x - eyeAcc.x); eyeAcc.y += 0.4 * (acc.y - eyeAcc.y);
    eyePrevVel = { x: nvx, y: nvy };
  }
  eyePrevPos = ec;

  const RX = 6.5, RY = 7.5; // pupil slack inside the 24x28 socket
  for (const P of pupils) {
    const ix = -(eyeAcc.x * cos + eyeAcc.y * sin) * 0.25 * P.k;
    const iy = -(-eyeAcc.x * sin + eyeAcc.y * cos) * 0.25 * P.k;
    P.vx += (gl.x * 520 + ix) * dt;
    P.vy += (gl.y * 520 + iy) * dt;
    const damp = Math.exp(-7 * dt);
    P.vx *= damp; P.vy *= damp;
    P.x += P.vx * dt; P.y += P.vy * dt;

    // keep the pupil inside the socket, bouncing off the rim
    const ex = P.x / RX, ey = P.y / RY, d = Math.hypot(ex, ey);
    if (d > 1) {
      const nx = ex / d, ny = ey / d;
      P.x = nx * RX; P.y = ny * RY;
      const vn = P.vx * nx / RX + P.vy * ny / RY;
      if (vn > 0) { P.vx -= 1.4 * vn * nx / RX; P.vy -= 1.4 * vn * ny / RY; }
    }
    P.el.style.transform = `translate(${P.x.toFixed(1)}px, ${P.y.toFixed(1)}px)`;
  }
}

/* ============ main loop ============ */
let lastT = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!dragging) {                       // spin momentum after release
    theta += thetaV * dt;
    thetaV *= Math.exp(-SPIN.DAMP * dt);
    if (Math.abs(thetaV) < 0.02) thetaV = 0;
  }
  tube.style.transform = `rotate(${theta}rad)`;

  stepDisk(dt);
  updateEyes(dt);
  updateSound();
  setTimeout(loop, 16);
}
loop();

/* ============ grab & spin ============ */
let grab = null;

tubeWrap.addEventListener('pointerdown', e => {
  dragging = true;
  try { tubeWrap.setPointerCapture(e.pointerId); } catch (err) {}
  tubeWrap.classList.add('dragging');
  const c = tubeCenter();
  grab = { x: e.clientX - c.x, y: e.clientY - c.y, t: performance.now() };
  thetaV = 0;
  e.preventDefault();
});

tubeWrap.addEventListener('pointermove', e => {
  if (!dragging || !grab) return;
  const c = tubeCenter();
  const px = e.clientX - c.x, py = e.clientY - c.y;
  const r2 = px * px + py * py;
  let dth;
  if (r2 > SPIN.NEAR * SPIN.NEAR) {
    // rotate so the grabbed point follows the finger/mouse
    dth = (grab.x * py - grab.y * px) / r2;
  } else {
    dth = (e.clientX - (grab.x + c.x)) * 0.005;   // near the center: fall back to horizontal drag
  }
  dth = clamp(dth, -SPIN.MAXSTEP, SPIN.MAXSTEP);
  theta += dth;
  const now = performance.now();
  const mdt = Math.max(8, now - grab.t) / 1000;
  thetaV = 0.75 * thetaV + 0.25 * (dth / mdt);
  grab = { x: px, y: py, t: now };
  e.preventDefault();
});

function endDrag() { dragging = false; grab = null; tubeWrap.classList.remove('dragging'); }
tubeWrap.addEventListener('pointerup', endDrag);
tubeWrap.addEventListener('pointercancel', endDrag);

function tubeCenter() {
  const r = tube.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

/* ============ motion: only ever changes where gravity points ============ */
let sm = { x: 0, y: 0, z: -9.81 }, lastShake = 0;

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  if (!motionLive) { motionLive = true; hint.textContent = 'Spin your phone!'; }

  const k = 0.35;
  sm.x += k * (a.x - sm.x); sm.y += k * (a.y - sm.y); sm.z += k * (a.z - sm.z);

  // calibrate the platform's gravity sign from the first second (phone starts upright)
  if (calibN < 40) {
    calibSum += sm.y; calibN++;
    if (calibN === 40 && Math.abs(calibSum) > 60) gSign = calibSum > 0 ? 1 : -1;
  }

  // physical shaking rattles the disk
  let lin = e.acceleration;
  if (!lin || lin.x == null) lin = { x: a.x - sm.x, y: a.y - sm.y, z: a.z - sm.z };
  const mag = Math.hypot(lin.x, lin.y, lin.z);
  const now = performance.now();
  if (mag > 6.5 && now - lastShake > 130) {
    lastShake = now;
    rattle(Math.min(1, (mag - 6.5) / 12));
  }
}

function rattle(intensity) {
  disk.v = clamp(disk.v + (Math.random() * 1.4 - 0.7) * (0.6 + intensity * 0.8), -PHYS.MAXV, PHYS.MAXV);
  pulseShake();
}

/* ============ UI ============ */
let shakeTimer = 0;

function pulseShake() {
  tubeWrap.classList.remove('shaking');
  void tubeWrap.offsetWidth;
  tubeWrap.classList.add('shaking');
  clearTimeout(shakeTimer);
  shakeTimer = setTimeout(() => tubeWrap.classList.remove('shaking'), 460);
}

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (master) master.gain.value = muted ? 0 : 0.9;
});

document.addEventListener('visibilitychange', () => {
  if (!ctx) return;
  if (document.hidden) ctx.suspend(); else ctx.resume();
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

let motionAttached = false;
function attachMotion() {
  if (motionAttached) return;
  window.addEventListener('devicemotion', onMotion);
  motionAttached = true;
}

// the tap-to-play screen is only needed where audio/motion require a user gesture (phones)
const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

async function startMobile() {
  initAudio();
  ctx.resume();
  overlay.classList.add('hide');

  const DME = window.DeviceMotionEvent;
  try {
    if (DME && typeof DME.requestPermission === 'function') {
      if (await DME.requestPermission() === 'granted') attachMotion();
    } else if (DME) {
      attachMotion();
    }
  } catch (err) { /* no motion — finger-spinning still works */ }
}

if (isMobile) {
  startBtn.addEventListener('click', startMobile);
} else {
  // desktop: no tap needed — the first grab unlocks audio
  overlay.classList.add('hide');
  tubeWrap.addEventListener('pointerdown', () => { initAudio(); ctx.resume(); }, { once: true });
}
})();
</script>
</body>
